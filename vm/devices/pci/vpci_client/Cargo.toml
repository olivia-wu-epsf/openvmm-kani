[package]
name = "vpci_client"
rust-version.workspace = true
edition.workspace = true

[features]
# Enables support for TDISP for AMD SEV-TIO
dev_snp_ohcl_tio_support = []

[dependencies]
openhcl_tdisp.workspace = true
pci_core.workspace = true
hvdef.workspace = true
tdisp.workspace = true
vpci_protocol.workspace = true
virt.workspace = true
vmbus_async.workspace = true
vmbus_channel.workspace = true
vmbus_ring.workspace = true
vmcore.workspace = true

inspect.workspace = true
mesh.workspace = true
pal_async.workspace = true
guestmem.workspace = true

anyhow.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
parking_lot.workspace = true
slab.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

# `tracing` / `tracelimit` are only linked under non-Kani builds. Under
# Kani the crate provides its own no-op `mod tracing` / `mod tracelimit`
# shims (see `lib.rs`). See the matching note in `tdisp/Cargo.toml` for
# why the `tracing/max_level_off` feature alone is insufficient.
[target.'cfg(not(kani))'.dependencies]
tracing.workspace = true
tracelimit.workspace = true

[dev-dependencies]
chipset_device.workspace = true
closeable_mutex.workspace = true
test_with_tracing.workspace = true
vpci.workspace = true
guid.workspace = true
mesh.workspace = true
task_control.workspace = true

[lints]
workspace = true
